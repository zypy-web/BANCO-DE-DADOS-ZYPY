name: Populate KaBuM links once

on:
  push:
    paths:
      - ".github/workflows/populate-kabum-links-once.yml"

permissions:
  contents: write

jobs:
  populate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect and append direct KaBuM product URLs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/populate_kabum_links.py
